
name: Deploy PRUX Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "web/**"
      - "firebase.json"
      - "database.rules.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "Missing FIREBASE_SERVICE_ACCOUNT"
            exit 1
          }

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Database
        run: |
          firebase deploy \
            --only hosting,database \
            --project detectcameracentral \
            --non-interactive
